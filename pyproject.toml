[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-text-cleaner"
version = "0.1.0"
description = "Regelbasierter + LLM-gestützter Cleaner für KI-typische Schreibmuster in deutschen Texten."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "web-werkstatt" }]
keywords = ["ai", "text", "cleaner", "german", "blog", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Linguistic",
  "Natural Language :: German",
]
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]
clipboard = ["pyperclip>=1.8"]
ml = ["spacy>=3.7", "scikit-learn>=1.3", "joblib>=1.3"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
ai-text-cleaner = "ai_text_cleaner.cli:main"

[project.urls]
Homepage = "https://github.com/web-werkstatt/ai-text-cleaner"
Issues = "https://github.com/web-werkstatt/ai-text-cleaner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_text_cleaner = ["*.yaml", "*.yml", "classifier/*.pkl", "classifier/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
